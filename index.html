<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script>
// ======================= STAGED SELF-HEALING + CRASH REPORTS =======================
// Stage 1: hang/error → reload (no data touched)
// Stage 2: hang/error again → clear temp cache/outbox → reload
// Stage 3: hang/error again → clear the saved session itself (alternate storage too) → reload, login screen shows a reset notice
// Stage 4: still failing → stop auto-reloading, show a manual-retry diagnostic screen
// A pure connectivity problem (navigator.onLine === false) skips all wiping and goes straight to a "slow/offline" retry screen.
// Every crash / recovery / unresolved event fires a best-effort email report via Code.gs (rate-limited server-side).
(function(){
  var STAGE_KEY = 'isp_recovery_stage';
  var NOTICE_KEY = 'isp_session_reset_notice';
  var DEVICE_KEY = 'isp_device_id';
  var WATCHDOG_MS = 6000;
  var watchdogTimer = null;
  var resolved = false;

  function getCookie(name){
    var m = document.cookie.match(new RegExp('(^|; )' + name + '=([^;]*)'));
    return m ? decodeURIComponent(m[2]) : null;
  }
  function setCookie(name, value, days){
    var expires = new Date(Date.now() + days*864e5).toUTCString();
    document.cookie = name + '=' + encodeURIComponent(value) + '; expires=' + expires + '; path=/';
  }
  function getDeviceId(){
    var id = null;
    try{ id = localStorage.getItem(DEVICE_KEY); }catch(e){}
    if(!id){ try{ id = getCookie(DEVICE_KEY); }catch(e){} }
    if(!id){
      id = 'dev-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      try{ localStorage.setItem(DEVICE_KEY, id); }catch(e){}
      try{ setCookie(DEVICE_KEY, id, 3650); }catch(e){}
    }
    return id;
  }
  function getStage(){ var v=0; try{ v = parseInt(sessionStorage.getItem(STAGE_KEY)||'0',10)||0; }catch(e){} return v; }
  function setStage(n){ try{ sessionStorage.setItem(STAGE_KEY, String(n)); }catch(e){} }

  function sendReport(type, stage, message){
    try{
      var url = window.APPS_SCRIPT_URL_FOR_REPORT;
      if(!url) return;
      fetch(url, {
        method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({action:'reportIssue', payload:{type:type, stage:stage, device:getDeviceId(), message:String(message||'').slice(0,300)}})
      }).catch(function(){});
    }catch(e){}
  }

  function showScreen(title, msg, buttonLabel){
    document.documentElement.innerHTML =
      '<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>' +
      '<body style="background:#10161d;color:#e7edf3;font-family:sans-serif;display:flex;align-items:center;' +
      'justify-content:center;min-height:100vh;text-align:center;padding:20px;direction:rtl;margin:0">' +
      '<div><h2 style="margin-bottom:10px">' + title + '</h2>' +
      '<p style="color:#8b9bab;margin-bottom:18px;font-size:14px;max-width:320px">' + msg + '</p>' +
      '<button onclick="location.reload()" style="background:#38c98f;color:#06231a;border:none;' +
      'padding:10px 20px;border-radius:8px;font-weight:700;cursor:pointer;font-size:14px">' + buttonLabel + '</button></div></body>';
  }

  function handleFailure(sourceMessage){
    if(resolved) return;
    resolved = true;

    if(navigator.onLine === false){
      sendReport('network', getStage(), sourceMessage);
      showScreen('ضعف أو انقطاع بالاتصال', 'تأكد من اتصالك بالإنترنت ثم أعد المحاولة. لم يتم حذف أي بيانات محفوظة.', 'إعادة المحاولة');
      return;
    }

    var stage = getStage() + 1;
    setStage(stage);
    sendReport('crash', stage, sourceMessage);

    if(stage === 1){
      location.reload();
    } else if(stage === 2){
      try{ localStorage.removeItem('isp_cache'); }catch(e){}
      try{ localStorage.removeItem('isp_outbox'); }catch(e){}
      location.reload();
    } else if(stage === 3){
      try{ localStorage.removeItem('isp_user'); }catch(e){}
      try{ sessionStorage.removeItem('isp_user'); }catch(e){}
      try{ setCookie('isp_user', '', -1); }catch(e){}
      try{ sessionStorage.setItem(NOTICE_KEY, '1'); }catch(e){}
      location.reload();
    } else {
      sendReport('unresolved', stage, sourceMessage);
      showScreen('حدث خطأ غير متوقع', 'تكرر الخطأ رغم محاولات الإصلاح التلقائي. اضغط الزر لإعادة المحاولة يدويًا، وإذا استمرت المشكلة تواصل مع المطوّر.', 'إعادة المحاولة');
    }
  }

  watchdogTimer = setTimeout(function(){ handleFailure('watchdog-timeout'); }, WATCHDOG_MS);
  window.addEventListener('error', function(e){ handleFailure(e && e.message); });
  window.addEventListener('unhandledrejection', function(e){ handleFailure(e && e.reason); });

  window.__ispRecoveryOK = function(){
    if(resolved) return;
    resolved = true;
    if(watchdogTimer) clearTimeout(watchdogTimer);
    var prevStage = getStage();
    if(prevStage > 0) sendReport('recovered', prevStage, '');
    setStage(0);
  };
  window.__ispConsumeResetNotice = function(){
    var had = false;
    try{ had = sessionStorage.getItem(NOTICE_KEY) === '1'; sessionStorage.removeItem(NOTICE_KEY); }catch(e){}
    return had;
  };
  // alternate-storage-aware session helpers, used by the main app
  window.__ispSession = {
    get: function(){
      try{ var v = localStorage.getItem('isp_user'); if(v) return v; }catch(e){}
      try{ var v2 = sessionStorage.getItem('isp_user'); if(v2) return v2; }catch(e){}
      try{ var v3 = getCookie('isp_user'); if(v3) return v3; }catch(e){}
      return null;
    },
    set: function(value, persistent){
      var ok = false;
      try{
        if(persistent){ localStorage.setItem('isp_user', value); } else { sessionStorage.setItem('isp_user', value); }
        ok = true;
      }catch(e){}
      if(!ok){ try{ setCookie('isp_user', value, persistent?365:1); ok = true; }catch(e){} }
      return ok;
    },
    clear: function(){
      try{ localStorage.removeItem('isp_user'); }catch(e){}
      try{ sessionStorage.removeItem('isp_user'); }catch(e){}
      try{ setCookie('isp_user','',-1); }catch(e){}
    }
  };
})();
</script>

<body>
<div id="root"></div>

<script>
// ======================= CONFIG =======================
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx-skHPz0bZ28exQM-98r0j0GV0sGG30J9NxIZbQ3I_CxQiil_JxhRaMa_TiaeV2Rqfmw/exec";
window.APPS_SCRIPT_URL_FOR_REPORT = APPS_SCRIPT_URL;
const ARABIC_MONTHS = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const DEFAULT_PRICING = { 2:120000, 3:150000, 5:225000, 8:320000, 12:450000 };

// ======================= STATE =======================
let state = {
  user: null,
  view: "dashboard",
  customers: [],
  pricing: DEFAULT_PRICING,
  payments: {},
  loading: false,
  error: "",
  statementCustomerId: null,
  activityLog: [],
  activityLogLoading: false,
  usersList: [],
  usersLoading: false,
  expensesList: [],
  expensesLoading: false,
  expensesMonth: null,
  expensesServer: [],
  expensesLoaded: false,
  expensesStale: false,
  expensesLastOk: 0,
  expensesLoadError: "",
  cashCounts: [],
  cashCountsError: "",
  lastBackup: "",
  lastBackupName: "",
};

const months = generateMonths();
const currentMonthKey = months[months.length - 1].key;

const FULL_YEAR_MONTHS = Array.from({length:12}, (_,i)=>({ key: monthKeyOf(2026, i+1), label: `${ARABIC_MONTHS[i]} 2026`, abbr: String(i+1) }));

// ======================= HELPERS =======================
function fmtMoney(n) { return (Number(n) || 0).toLocaleString("en-US") + " ل.س"; }
function monthKeyOf(y,m){ return `${y}-${String(m).padStart(2,"0")}`; }
function generateMonths(){
  const now = new Date();
  const endY = now.getFullYear(), endM = now.getMonth()+1;
  const out = []; let y=2026,m=1,guard=0;
  while((y<endY || (y===endY && m<=endM)) && guard<240){
    out.push({key:monthKeyOf(y,m), label:`${ARABIC_MONTHS[m-1]} ${y}`});
    m++; if(m>12){m=1;y++;} guard++;
  }
  if(out.length===0) out.push({key:monthKeyOf(2026,1), label:`${ARABIC_MONTHS[0]} 2026`});
  return out;
}
function todayStr(){ const d=new Date(); return `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`; }
function isoToDateStr(iso){ if(!iso) return "—"; const d=new Date(iso); return `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`; }
function monthsPhrase(n){
  if(n===1) return "شهر واحد";
  if(n===2) return "شهرين";
  return `${n} أشهر`;
}
function toWhatsAppNumber(phone){
  let p=String(phone==null?"":phone).replace(/[^\d+]/g,"");
  if(p.startsWith("+")) return p.slice(1);
  if(p.startsWith("963")) return p;
  if(p.startsWith("0")) return "963"+p.slice(1);
  if(/^9\d{8}$/.test(p)) return "963"+p; // Syrian mobile whose leading 0 was lost
  return p; // already has its own country code (entered without a leading +)
}
function waLink(phone,message){ return `https://wa.me/${toWhatsAppNumber(phone)}?text=${encodeURIComponent(message)}`; }
function priceFor(speed){ return state.pricing[speed] ?? 0; }
function monthLabelOf(key){ return months.find(m=>m.key===key)?.label || key || "—"; }

function buildReminderMessage(c, unpaidMonths, debtAmount){
  const list = unpaidMonths.map(m=>m.label).join("، ");
  return `مرحبًا ${c.name}،
نذكّركم بوجود دفعات مستحقة على حساب الإنترنت (${c.mikrotik || "—"}) عن الأشهر التالية: ${list}.
المبلغ الإجمالي المتراكم: ${fmtMoney(debtAmount)}.
تاريخ الإبلاغ: ${todayStr()}.
نرجو التكرم بالتسديد في أقرب وقت ممكن. شكرًا لتعاونكم.`;
}
function buildConfirmMessage(c, monthLabel, amount){
  return `مرحبًا ${c.name}،
نؤكد استلام دفعتكم عن شهر ${monthLabel} بمبلغ ${fmtMoney(amount)} لحساب الإنترنت (${c.mikrotik || "—"}).
شكرًا لتعاملكم معنا.
تاريخ التأكيد: ${todayStr()}`;
}
function buildStatementMessage(c, rows, totalPaid, totalDue){
  const lines = rows.map(r => {
    if(r.status==='paid') return `${r.label}: مدفوع (${fmtMoney(r.amount)}) بتاريخ ${isoToDateStr(r.date)}`;
    if(r.status==='not_subscribed') return `${r.label}: غير مشترك`;
    if(r.status==='not_due_yet') return `${r.label}: لم يحن موعده بعد`;
    return `${r.label}: غير مدفوع`;
  });
  return `كشف حساب — ${c.name}
حساب المايكروتك: ${c.mikrotik || "—"}
الباقة: ${c.speed} ميغا

${lines.join("\n")}

إجمالي المدفوع: ${fmtMoney(totalPaid)}
إجمالي المتبقي: ${fmtMoney(totalDue)}
تاريخ الكشف: ${todayStr()}`;
}

// ======================= SEARCH + DATA SANITIZING HELPERS =======================
// Arabic-aware normalisation so "احمد" matches "أحمد", "فاطمة" matches "فاطمه", Arabic digits match Latin digits, etc.
function normAr(s){
  return String(s==null?"":s)
    .toLowerCase()
    .replace(/[\u064B-\u065F\u0670\u0640]/g,"")
    .replace(/[أإآٱ]/g,"ا")
    .replace(/ى/g,"ي")
    .replace(/ة/g,"ه")
    .replace(/ؤ/g,"و")
    .replace(/ئ/g,"ي")
    .replace(/[٠-٩]/g, d=>String("٠١٢٣٤٥٦٧٨٩".indexOf(d)))
    .replace(/[۰-۹]/g, d=>String("۰۱۲۳۴۵۶۷۸۹".indexOf(d)))
    .replace(/\s+/g," ")
    .trim();
}
// every word typed must appear somewhere in the searched fields
function matchesSearch(fields, term){
  const t = normAr(term);
  if(!t) return true;
  const hay = fields.map(normAr).join(" ");
  return t.split(" ").every(tok=>hay.includes(tok));
}
function escAttr(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
// Sheets turns "0933123456" into the number 933123456 (leading zero lost). Restore it for Syrian mobiles.
function fixPhone(v){
  let s = String(v==null?"":v).trim();
  if(/^9\d{8}$/.test(s)) s = "0"+s;
  return s;
}
// make sure every text field really is a string, whatever type the sheet returned
function sanitizeCustomers(list){
  return (list||[]).map(c=>({
    ...c,
    name: String(c.name==null?"":c.name),
    phone: fixPhone(c.phone),
    address: String(c.address==null?"":c.address),
    mikrotik: String(c.mikrotik==null?"":c.mikrotik),
    notes: String(c.notes==null?"":c.notes),
  }));
}

// ======================= API =======================
async function api(action, payload={}){
  // the server decides who you are from this token; the page can no longer claim a name or a role
  const body = { action, payload };
  if(state.user && state.user.token) body.token = state.user.token;
  try{
    const res = await fetch(APPS_SCRIPT_URL, {
      method:"POST",
      headers: {"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if(data && data.authError) handleAuthExpired();
    return data;
  } catch(e){
    return { ok:false, networkError:true, error:"تعذر الاتصال بالخادم. تحقق من الإنترنت." };
  }
}
function handleAuthExpired(){
  if(!state.user) return;
  state.user = null;
  window.__ispSession.clear();
  try{ sessionStorage.setItem("isp_session_expired","1"); }catch(e){}
  render();
}

// ======================= OFFLINE CACHE + OUTBOX =======================
function cacheData(){
  try{ localStorage.setItem('isp_cache', JSON.stringify({customers:state.customers, pricing:state.pricing, payments:state.payments, ts:Date.now()})); }catch(e){}
}
function loadCache(){
  try{ return JSON.parse(localStorage.getItem('isp_cache')||'null'); }catch(e){ return null; }
}
function getOutbox(){ try{ return JSON.parse(localStorage.getItem('isp_outbox')||'[]'); }catch(e){ return []; } }
function setOutbox(arr){ try{ localStorage.setItem('isp_outbox', JSON.stringify(arr)); }catch(e){} }
function newQid(){ return "q" + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function newClientId(){ return "c-" + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
// every queued change remembers WHO made it: it is only ever sent under that same user's login,
// so "recorded by" in the sheet and in the activity log stays truthful
function queueOutbox(action, payload){
  const q = getOutbox();
  q.push({ qid:newQid(), action, payload, ts:Date.now(), by: state.user ? state.user.username : "" });
  setOutbox(q);
}
function removeFromOutbox(qid){ setOutbox(getOutbox().filter(x=>x.qid!==qid)); }
function markSending(qid, on){
  const q = getOutbox();
  const it = q.find(x=>x.qid===qid);
  if(!it) return;
  if(on) it.sending = true; else delete it.sending;
  setOutbox(q);
}
function isInFlight(item){ return !!item.sending && outboxSyncing; }
function getRejected(){ try{ return JSON.parse(localStorage.getItem('isp_outbox_rejected')||'[]'); }catch(e){ return []; } }
function setRejected(arr){ try{ localStorage.setItem('isp_outbox_rejected', JSON.stringify(arr)); }catch(e){} }
function isMine(item){ return !item.by || !state.user || item.by===state.user.username; }

let outboxSyncing = false;
// Sends queued changes one by one, oldest first.
//  - no connection / session expired  -> keep EVERYTHING and try again later (nothing is lost)
//  - accepted                          -> removed
//  - refused by the server             -> moved to the "needs review" list, never dropped silently
async function trySyncOutbox(){
  if(outboxSyncing || !state.user || !state.user.token) return;
  outboxSyncing = true;
  let done = 0, rejected = 0, finOps = false;
  try{
    while(state.user && state.user.token){
      const q = getOutbox();
      let touched = false;
      q.forEach(it=>{ if(!it.qid){ it.qid = newQid(); touched = true; } });
      if(touched) setOutbox(q);
      const item = q.find(isMine);
      if(!item) break;
      markSending(item.qid, true);                      // the request below already carries the OLD data: an edit now must wait
      const res = await api(item.action, item.payload);
      if(res.networkError || res.authError){ markSending(item.qid, false); break; }
      removeFromOutbox(item.qid);                       // progress is saved after EVERY item
      if(res.ok || res.alreadyPaid){
        done++;
        if(item.action==="addExpense" || item.action==="editExpense") finOps = true;
      } else {
        const rej = getRejected();
        rej.push({ action:item.action, payload:item.payload, by:item.by||"", error:res.error || "رفض الخادم العملية", ts:Date.now() });
        setRejected(rej);
        rejected++;
        if(item.action==="addExpense" || item.action==="editExpense") finOps = true;
      }
    }
  } finally { outboxSyncing = false; }
  if(done) showToast(`تمت مزامنة ${done} تغيير معلّق ✓`);
  if(rejected) showToast(`${rejected} تغيير رفضه الخادم — اضغط التنبيه أعلى الصفحة لمراجعته`, 6000);
  if(done || rejected){
    // refresh the cash box BEFORE anything else and do not drop the waiting entries first:
    // they stay visible (marked pending) until the server list that contains them arrives
    if(finOps || state.view==="expenses") await loadExpenses(true); else rebuildExpensesFromOutbox();
    await loadAllData(true);
  }
}
window.addEventListener('online', ()=>{
  trySyncOutbox();
  if(state.user && state.view==="expenses" && state.expensesStale) loadExpenses(true);
});

// ---- readable description of a queued / refused change ----
function describeOp(item){
  const p = item.payload || {};
  const cust = id => (state.customers.find(c=>c.id===id)||{}).name || "";
  switch(item.action){
    case "setPaymentStatus": return `دفعة ${cust(p.customerId)} — ${monthLabelOf(p.month)}`;
    case "editCustomer": return `تعديل بيانات ${cust(p.id)}`;
    case "saveReminder": return `${p.kind==="reminder" ? "تذكير" : "وعد بالدفع"} — ${cust(p.id)}`;
    case "addExpense": return `حركة صندوق: ${p.category||""} ${fmtCurrency(p.amount, p.currency)} (${p.date||""})`;
    case "editExpense": return "تعديل حركة صندوق";
    default: return item.action;
  }
}
function openRejectedModal(){
  const list = getRejected();
  closeRejectedModal();
  if(!list.length) return;
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "rejected-overlay";
  overlay.innerHTML = `
    <div class="modal-box stack-form" style="max-width:520px;max-height:90vh;overflow-y:auto">
      <h3>تغييرات رفضها الخادم (${list.length})</h3>
      <div style="color:var(--muted);font-size:12.5px;margin-bottom:10px">لم تُحفظ هذه التغييرات. أصلح السبب ثم أعد المحاولة، أو احذفها إن لم تعد مطلوبة.</div>
      ${list.map((it,i)=>`
        <div style="border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px">
          <div style="font-weight:600;font-size:13.5px">${escAttr(describeOp(it))}</div>
          <div style="color:var(--danger);font-size:12.5px;margin:4px 0 8px">${escAttr(it.error)}</div>
          <div style="display:flex;gap:6px">
            <button class="btn small" onclick="retryRejected(${i})">إعادة المحاولة</button>
            <button class="btn danger small" onclick="discardRejected(${i})">حذف</button>
          </div>
        </div>`).join("")}
      <div class="modal-actions"><button class="btn secondary" onclick="closeRejectedModal()">إغلاق</button></div>
    </div>`;
  document.body.appendChild(overlay);
}
function closeRejectedModal(){
  const el = document.getElementById("rejected-overlay");
  if(el) el.remove();
}
function retryRejected(i){
  const list = getRejected();
  const it = list[i];
  if(!it) return;
  list.splice(i,1); setRejected(list);
  const q = getOutbox();
  q.push({ qid:newQid(), action:it.action, payload:it.payload, ts:Date.now(), by:it.by||"" });
  setOutbox(q);
  rebuildExpensesFromOutbox();
  render(); openRejectedModal();
  trySyncOutbox();
}
function discardRejected(i){
  if(!confirm("حذف هذا التغيير نهائيًا؟ لن يُحفظ.")) return;
  const list = getRejected(); list.splice(i,1); setRejected(list);
  render(); openRejectedModal();
}
function agoText(ts){
  if(!ts) return "";
  const m = Math.round((Date.now()-ts)/60000);
  if(m < 1) return "الآن";
  if(m < 60) return `قبل ${m} دقيقة`;
  const h = Math.round(m/60);
  if(h < 24) return `قبل ${h} ساعة`;
  return `قبل ${Math.round(h/24)} يوم`;
}
function outboxBannerHtml(){
  const q = getOutbox(), mine = q.filter(isMine).length, others = q.length - mine, rej = getRejected().length;
  let h = "";
  if(mine>0) h += `<div class="offline-banner no-print">⚠ ${mine} تغيير بانتظار الاتصال بالإنترنت للمزامنة${others>0 ? ` · ${others} تخص مستخدمًا آخر وتُرسل عند دخوله` : ""}</div>`;

}

const FIN_CACHE_KEY = 'isp_cache_fin';
function cacheFin(){

}

// the list the page works with = what the server last told us + the changes still waiting in the queue
function overlayExpenses(serverList){
  const list = (serverList||[]).map(e=>({...e}));
  getOutbox().forEach(item=>{
    const p = item.payload || {};
    if(item.action==="addExpense"){
      const id = p.clientId || ("p-"+item.qid);
      if(list.some(e=>e.id===id)) return;
      list.push({ id, type:p.type, box:p.box, rate:p.rate||0, date:p.date, category:p.category, categoryOther:p.categoryOther||"",
                  recipient:p.recipient, recipientOther:p.recipientOther||"", currency:p.currency, amount:p.amount, notes:p.notes||"",
                  addedBy: item.by || "", pending:true });
    } else if(item.action==="editExpense"){
      const idx = list.findIndex(e=>e.id===p.id);
      if(idx>-1) list[idx] = { ...list[idx], ...p.patch, id:p.id, pending:true };
    }
  });
  return list;
}
function rebuildExpensesFromOutbox(){ state.expensesList = overlayExpenses(state.expensesServer); }
// returns false (not queued), "busy" (being sent this very moment) or true (rewritten)
function updateQueuedAdd(clientId, form){
  const q = getOutbox();
  const it = q.find(x=>x.action==="addExpense" && x.payload && x.payload.clientId===clientId);
  if(!it) return false;
  if(isInFlight(it)) return "busy";
  it.payload = { ...form, clientId };
  setOutbox(q);
  return true;
}
function cancelQueuedAdd(clientId){
  const q = getOutbox();
  const it = q.find(x=>x.action==="addExpense" && x.payload && x.payload.clientId===clientId);
  if(!it) return false;
  if(isInFlight(it)) return "busy";
  removeFromOutbox(it.qid);
  return true;
}

async function loadAllData(silent){
  const cached = loadCache();
  if(cached && !state.customers.length){
    // instant paint from last known data while we fetch fresh data (helps on slow/offline connections)
    state.customers = sanitizeCustomers(cached.customers); state.pricing = cached.pricing; state.payments = cached.payments;
  }
  if(!silent){ state.loading = !state.customers.length ? true : false; render(); }
  const res = await api("getAllData");
  if(res.ok){
    state.customers = sanitizeCustomers(res.customers);
    state.pricing = res.pricing && Object.keys(res.pricing).length ? res.pricing : DEFAULT_PRICING;
    state.payments = res.payments;
    state.error = "";
    cacheData();
  } else if(res.networkError){
    state.error = cached ? "غير متصل بالإنترنت — تُعرض آخر نسخة محفوظة محليًا." : "تعذر الاتصال بالخادم. تحقق من الإنترنت.";
  } else {
    state.error = res.error || "تعذر تحميل البيانات";

  trySyncOutbox();
}

// ======================= DERIVED DATA =======================
function enabledCustomers(){ return state.customers.filter(c=>c.active!==false); }

// Status model per (customer, month):
//  'paid'           -> explicit record, Paid=true
//  'not_subscribed' -> explicit record OR implied (month before joinMonth) OR implied (month in the future, not due yet)
//  'unpaid'         -> no record, month is on/before the current month, and on/after joinMonth
function getStatementRows(customer){
  return FULL_YEAR_MONTHS.map(m=>{
    const rec = state.payments[`${customer.id}:${m.key}`];
    const due = priceFor(customer.speed);
    let status;
    if(rec && rec.status==='paid') status = 'paid';
    else if(rec && rec.status==='not_subscribed') status = 'not_subscribed';
    else if(rec && rec.status==='unpaid') status = 'unpaid';
    else if(customer.joinMonth && m.key < customer.joinMonth) status = 'not_subscribed';
    else if(m.key > currentMonthKey) status = 'not_due_yet';
    else status = 'unpaid';
    return {
      key:m.key, label:m.label, abbr:m.abbr, due, status,
      paid: status==='paid',
      amount: rec?.amount||0, date: rec?.date||null, recordedBy: rec?.recordedBy||"",
      receivedBy: rec?.receivedBy==='firas' ? 'firas' : 'mohammed'
    };
  });
}

function customerStatsList(){
  return enabledCustomers().map(c=>{
    const rows = getStatementRows(c);
    const unpaidRows = rows.filter(r=>r.status==='unpaid');
    const lateNow = unpaidRows.some(r=>r.key===currentMonthKey);
    const debtAmount = unpaidRows.length * priceFor(c.speed);
    return {...c, unpaidCount:unpaidRows.length, lateNow, unpaidMonths:unpaidRows, debtAmount, allRows:rows};
  });
}

function dashboardData(){
  const stats = customerStatsList();
  const active = enabledCustomers().filter(c=> !c.joinMonth || c.joinMonth<=currentMonthKey);
  const totalExpected = active.reduce((s,c)=>s+priceFor(c.speed),0);
  const collectedThisMonth = enabledCustomers().reduce((s,c)=>{
    const rec = state.payments[`${c.id}:${currentMonthKey}`];
    return s + (rec?.status==='paid' ? rec.amount : 0);
  },0);
  const paidCount = enabledCustomers().filter(c=>state.payments[`${c.id}:${currentMonthKey}`]?.status==='paid').length;
  const lateNowList = stats.filter(c=>c.lateNow);
  const debtorsList = stats.filter(c=>c.unpaidCount>=2).sort((a,b)=>b.debtAmount-a.debtAmount);
  const collectionRate = totalExpected>0 ? Math.round((collectedThisMonth/totalExpected)*100) : 0;
  const totalOutstanding = stats.reduce((s,c)=>s+c.debtAmount,0);
  const newThisMonth = enabledCustomers().filter(c=>c.joinMonth===currentMonthKey).length;
  const avgRevenue = active.length>0 ? Math.round(totalExpected/active.length) : 0;
  const withDebt = stats.filter(c=>c.unpaidCount>0);
  const avgOverdueMonths = withDebt.length>0 ? (withDebt.reduce((s,c)=>s+c.unpaidCount,0)/withDebt.length).toFixed(1) : "0";
  return { totalExpected, collectedThisMonth, paidCount, lateNowList, debtorsList, collectionRate, totalOutstanding, newThisMonth, avgRevenue, activeCount: active.length, avgOverdueMonths, withDebtCount: withDebt.length };
}

function debtAgingData(){
  const stats = customerStatsList();
  const buckets = [
    { label:"شهر واحد", count:0 },
    { label:"شهرين", count:0 },
    { label:"3 أشهر", count:0 },
    { label:"4+ أشهر", count:0 },
  ];
  stats.forEach(c=>{
    if(c.unpaidCount<=0) return;
    if(c.unpaidCount===1) buckets[0].count++;
    else if(c.unpaidCount===2) buckets[1].count++;
    else if(c.unpaidCount===3) buckets[2].count++;
    else buckets[3].count++;
  });
  return buckets;
}

function monthlyTrendData(){
  const recent = months.slice(-6);
  return recent.map(m=>{
    const activeAt = enabledCustomers().filter(c=> !c.joinMonth || c.joinMonth<=m.key);
    const expected = activeAt.reduce((s,c)=>s+priceFor(c.speed),0);
    const collected = enabledCustomers().reduce((s,c)=>{
      const rec = state.payments[`${c.id}:${m.key}`];
      return s + (rec?.status==='paid' ? rec.amount : 0);
    },0);
    return { label:m.label.split(" ")[0], expected, collected };
  });
}

function speedBreakdownData(){
  const map = {};
  enabledCustomers().forEach(c=>{
    if(!map[c.speed]) map[c.speed]={speed:c.speed,count:0,revenue:0};
    map[c.speed].count++; map[c.speed].revenue+=priceFor(c.speed);
  });
  return Object.values(map).sort((a,b)=>a.speed-b.speed);
}

async function submitLogin(){
  const username = document.getElementById("login-username").value.trim();
  const password = document.getElementById("login-password").value;
  const remember = document.getElementById("login-remember").checked;
  const errEl = document.getElementById("login-error");

    state.user = { ...r.user, token:r.token };

    await loadAllData();
    render();
    setTimeout(maybeShowInstallPrompt, 600);
  } else {
    errEl.textContent = r.error || "خطأ في تسجيل الدخول";
  }
}

function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme')==='light' ? 'light' : 'dark';

  if(next==='light') document.documentElement.setAttribute('data-theme','light');
  else document.documentElement.removeAttribute('data-theme');
  try{ localStorage.setItem('isp_theme', next); }catch(e){}

// ======================= FOLLOW-UP (last reminder + promise to pay) =======================
function daysSince(iso){
  if(!iso || isNaN(new Date(iso))) return null;
  const a = new Date(localDateStr(iso) + "T00:00:00"), b = new Date(todayDateStr() + "T00:00:00");
  return Math.round((b - a) / 86400000);
}
function followUpHtmlRaw(c){
  const parts = [];
  if(c.lastReminderAt){
    const n = daysSince(c.lastReminderAt);
    if(n !== null) parts.push(`آخر تذكير: ${n<=0 ? "اليوم" : n===1 ? "أمس" : "قبل "+n+" أيام"}${c.lastReminderBy ? " ("+escAttr(c.lastReminderBy)+")" : ""}`);
  }
  if(c.promiseDate){
    const expired = c.promiseDate < todayDateStr();
    parts.push(`<span style="color:${expired?"var(--danger)":"var(--accent)"};font-weight:600">وعد بالدفع: ${escAttr(c.promiseDate)}${expired?" — انقضى":""}</span>${c.promiseNote ? ` <span style="color:var(--muted)">(${escAttr(c.promiseNote)})</span>` : ""}`);
  }
  return parts.join("<br/>");
}
function followUpHtml(c){ return followUpHtmlRaw(c) || '<span style="color:var(--muted)">—</span>'; }
function refreshFollowCells(id){
  if(!document.querySelectorAll) return;
  const c = state.customers.find(x=>x.id===id);
  if(!c) return;
  document.querySelectorAll(`[data-follow="${id}"]`).forEach(el=>{ el.innerHTML = followUpHtml(c); });
}
function patchCustomerLocal(id, patch){
  const idx = state.customers.findIndex(x=>x.id===id);
  if(idx>=0){ state.customers[idx] = {...state.customers[idx], ...patch}; cacheData(); }
}

function sendReminder(id){
  const c = customerStatsList().find(x=>x.id===id);
  if(!c) return;
  window.open(waLink(c.phone, buildReminderMessage(c, c.unpaidMonths, c.debtAmount)), "_blank");
  recordReminder(id);
}
async function recordReminder(id){
  patchCustomerLocal(id, { lastReminderAt:new Date().toISOString(), lastReminderBy:state.user.name });
  refreshFollowCells(id);
  const r = await api("saveReminder", {id, kind:"reminder"});
  if(r.networkError){ queueOutbox("saveReminder", {id, kind:"reminder"}); return; }
  if(!r.ok) showToast(r.error || "تعذر تسجيل التذكير");
}

function openPromiseModal(id){
  const c = state.customers.find(x=>x.id===id);
  if(!c) return;
  closePromiseModal();
  const d = new Date(); d.setDate(d.getDate()+3);
  const def = c.promiseDate || `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "promise-overlay";
  overlay.innerHTML = `
    <div class="modal-box stack-form">
      <h3>وعد بالدفع — ${escAttr(c.name)}</h3>
      <div class="form-row"><div><label>سيدفع حتى تاريخ</label><input id="pm-date" type="date" value="${def}" /></div></div>
      <div class="form-row"><div><label>ملاحظة (اختياري)</label><input id="pm-note" value="${escAttr(c.promiseNote||"")}" placeholder="مثال: بعد قبض الراتب" /></div></div>
      <div class="modal-actions">
        <button class="btn" onclick='savePromise(${JSON.stringify(id)})'>حفظ الوعد</button>
        ${c.promiseDate ? `<button class="btn danger" onclick='clearPromise(${JSON.stringify(id)})'>إلغاء الوعد</button>` : ""}
        <button class="btn secondary" onclick="closePromiseModal()">إغلاق</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
}
function closePromiseModal(){
  const el = document.getElementById("promise-overlay");
  if(el) el.remove();
}
async function savePromise(id){
  const date = document.getElementById("pm-date").value;
  const note = document.getElementById("pm-note").value.trim();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){ alert("اختر تاريخ الوعد"); return; }
  closePromiseModal();
  patchCustomerLocal(id, { promiseDate:date, promiseNote:note });
  refreshFollowCells(id);
  const payload = {id, kind:"promise", promiseDate:date, promiseNote:note};
  const r = await api("saveReminder", payload);
  if(r.networkError){ queueOutbox("saveReminder", payload); showToast("لا يوجد اتصال — سيُحفظ الوعد عند عودة الإنترنت"); return; }
  if(!r.ok){ showToast(r.error || "تعذر حفظ الوعد"); await loadAllData(); return; }
  showToast("تم تسجيل الوعد ✓");
}
async function clearPromise(id){
  closePromiseModal();
  patchCustomerLocal(id, { promiseDate:"", promiseNote:"" });
  refreshFollowCells(id);
  const r = await api("saveReminder", {id, kind:"clearPromise"});
  if(r.networkError){ queueOutbox("saveReminder", {id, kind:"clearPromise"}); return; }
  if(!r.ok){ showToast(r.error || "تعذر الإلغاء"); await loadAllData(); return; }
  showToast("أُلغي الوعد");
}

const PIE_COLORS = ["#38c98f","#eab04d","#4d9ceb","#e2604f","#a68df0","#5fd4d4"];

function renderTrendBars(trend){
  const maxVal = Math.max(1, ...trend.map(t=>Math.max(t.expected, t.collected)));
  const pct = v => Math.max(v>0?4:0, Math.round(v/maxVal*100));
  return `
    <div class="legend-row">
      <span class="legend-dot" style="background:var(--border)"></span> المتوقع
      <span class="legend-dot" style="background:var(--accent);margin-right:14px"></span> المحصّل
    </div>
    <div style="display:flex;align-items:flex-end;gap:10px;height:160px;padding-top:10px;overflow-x:auto">
      ${trend.map(t=>`
        <div style="flex:1;min-width:38px;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end">
          <div style="display:flex;align-items:flex-end;gap:3px;height:130px">
            <div style="width:12px;background:var(--border);height:${pct(t.expected)}%;border-radius:3px 3px 0 0" title="المتوقع: ${fmtMoney(t.expected)}"></div>
            <div style="width:12px;background:var(--accent);height:${pct(t.collected)}%;border-radius:3px 3px 0 0" title="المحصّل: ${fmtMoney(t.collected)}"></div>
          </div>
          <div style="font-size:11px;color:var(--muted);white-space:nowrap">${t.label}</div>
        </div>
      `).join("")}
    </div>
  `;
}

function renderSpeedBar(breakdown){
  if(breakdown.length===0) return `<div class="empty">لا توجد بيانات بعد</div>`;
  const total = breakdown.reduce((s,b)=>s+b.count,0) || 1;
  return `
    <div style="display:flex;height:22px;border-radius:6px;overflow:hidden;margin-bottom:14px">
      ${breakdown.map((b,i)=>`<div style="width:${Math.round(b.count/total*100)}%;background:${PIE_COLORS[i%PIE_COLORS.length]}" title="${b.speed} ميغا: ${b.count} زبون"></div>`).join("")}
    </div>
    ${breakdown.map((b,i)=>`
      <div class="legend-row" style="justify-content:space-between">
        <span><span class="legend-dot" style="background:${PIE_COLORS[i%PIE_COLORS.length]}"></span> ${b.speed} ميغا</span>
        <span>${b.count} زبون — ${fmtMoney(b.revenue)}</span>
      </div>
    `).join("")}
  `;
}

function renderAgingBars(aging){
  const maxVal = Math.max(1, ...aging.map(a=>a.count));
  const colors = ["#eab04d","#e2924d","#e2704d","#e2604f"];
  return aging.map((a,i)=>`
    <div style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px">
        <span>${a.label}</span><span style="color:var(--muted)">${a.count} زبون</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${Math.round(a.count/maxVal*100)}%;background:${colors[i]}"></div></div>
    </div>
  `).join("");
}

async function submitCustomerForm(){
  const payload = readCustomerFields("cf");
  if(!payload.name){ alert("أدخل اسم الزبون"); return; }
  const r = await api("addCustomer", payload);
  if(r.networkError){ alert("لا يوجد اتصال بالإنترنت — لم تتم إضافة الزبون. أعد المحاولة عند عودة الاتصال."); return; }
  if(!r.ok){ alert(r.error || "تعذرت الإضافة"); return; }
  customerForm = { name:"", phone:"", address:"", speed:null, mikrotik:"", notes:"", joinMonth:currentMonthKey };
  showToast("تمت إضافة الزبون ✓");
  await loadAllData();
}

function openCustomerEditModal(id){
  const c = state.customers.find(x=>x.id===id);
  if(!c) return;
  closeCustomerEditModal();
  const v = { name:c.name, phone:c.phone, address:c.address||"", speed:c.speed, mikrotik:c.mikrotik||"", notes:c.notes||"", joinMonth:c.joinMonth||currentMonthKey };
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "customer-edit-overlay";
  overlay.innerHTML = `
    <div class="modal-box stack-form">
      <h3>تعديل بيانات: ${escAttr(c.name)}</h3>
      ${customerFieldsHtml("ce", v)}
      <div class="modal-actions">
        <button class="btn" onclick='saveCustomerEdit(${JSON.stringify(id)})'>حفظ التعديل</button>
        <button class="btn secondary" onclick="closeCustomerEditModal()">إلغاء</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  setTimeout(()=>{ const el = document.getElementById("ce-name"); if(el) el.focus(); }, 60);

function closeCustomerEditModal(){
  const el = document.getElementById("customer-edit-overlay");
  if(el) el.remove();
}
async function saveCustomerEdit(id){
  const patch = readCustomerFields("ce");
  if(!patch.name){ alert("أدخل اسم الزبون"); return; }
  const idx = state.customers.findIndex(x=>x.id===id);
  const backup = idx>=0 ? {...state.customers[idx]} : null;
  closeCustomerEditModal();
  // optimistic: update the row instantly, keep your place in the list
  if(idx>=0){
    state.customers[idx] = {...state.customers[idx], ...patch, lastEditedBy: state.user.name};
    cacheData();
  }
  refreshCustomersTable();
  const r = await api("editCustomer", {id, patch});
  if(r.networkError){
    queueOutbox("editCustomer", {id, patch});
    showToast("لا يوجد اتصال — سيُحفظ التعديل تلقائيًا عند عودة الإنترنت");
    return;
  }
  if(!r.ok){
    if(backup && idx>=0){ state.customers[idx] = backup; cacheData(); refreshCustomersTable(); }
    alert(r.error || "تعذر حفظ التعديل");
    return;
  }
  showToast("تم حفظ التعديل ✓");
}

function customerTotals(c){
  const rows = getStatementRows(c);
  const totalDebt = rows.filter(r=>r.status==='unpaid').reduce((s,r)=>s+r.due,0);
  const totalPaid = rows.filter(r=>r.status==='paid').reduce((s,r)=>s+r.amount,0);
  const overdueCount = rows.filter(r=>r.status==='unpaid').length;
  const lastStatus = rows.slice().reverse().find(r=>r.status!=='not_due_yet')?.status || 'unpaid';
  return { totalDebt, totalPaid, overdueCount, lastStatus };
}

function filteredGridCustomers(){
  const term = (state.paymentsSearch||"").trim().toLowerCase();
  const sort = state.paymentsSort || "name";
  const filter = state.paymentsFilter || "all";
  let list = enabledCustomers().slice();
  if(term){
    list = list.filter(c => matchesSearch([c.name, c.mikrotik], term));
  }
  if(filter!=="all"){
    list = list.filter(c=>{
      const t = customerTotals(c);
      if(filter==="has_debt") return t.totalDebt>0;
      if(filter==="no_debt") return t.totalDebt===0;
      if(filter==="not_subscribed") return t.lastStatus==='not_subscribed';
      return true;
    });
  }
  if(sort==="mikrotik"){
    list.sort((a,b)=> (a.mikrotik||"").localeCompare(b.mikrotik||"", 'ar'));
  } else if(sort==="most_debt"){
    list.sort((a,b)=> customerTotals(b).totalDebt - customerTotals(a).totalDebt);
  } else if(sort==="most_paid"){
    list.sort((a,b)=> customerTotals(b).totalPaid - customerTotals(a).totalPaid);
  } else if(sort==="most_overdue"){
    list.sort((a,b)=> customerTotals(b).overdueCount - customerTotals(a).overdueCount);
  } else {
    list.sort((a,b)=> (a.name||"").localeCompare(b.name||"", 'ar'));
  }
  return list;
}

function gridCellContent(row){
  if(row.status==='paid') return `<span style="color:var(--accent);font-weight:700">${row.receivedBy==='firas' ? '<span title="تحويل مباشر لفراس" style="color:var(--warn)">●</span> ' : ''}${fmtMoney(row.amount)}</span>`;
  if(row.status==='not_subscribed') return `<span style="color:var(--muted)">غ.م</span>`;
  if(row.status==='not_due_yet') return `<span style="color:var(--muted)">—</span>`;
  return `<span style="color:var(--danger);font-weight:700">لم يدفع</span>`;
}

  if(el) el.remove();
}
function applyLocalPaymentUpdate(customerId, month, status, amount, recordedBy, receivedBy, dateIso){
  const key = `${customerId}:${month}`;
  if(status==='unpaid'){
    const c = state.customers.find(x=>x.id===customerId);
    if(c && c.joinMonth && month < c.joinMonth){
      state.payments[key] = { status:'unpaid', amount:0, date:new Date().toISOString(), recordedBy };
    } else {
      delete state.payments[key];
    }
  } else {
    state.payments[key] = { status, amount, date: dateIso || new Date().toISOString(), recordedBy, receivedBy: status==='paid' ? (receivedBy || state.payments[key]?.receivedBy || 'mohammed') : undefined };
  }
  cacheData();

  const c = state.customers.find(x=>x.id===customerId);
  if(!c) return;
  const row = getStatementRows(c).find(r=>r.key===month);
  const gridCell = document.getElementById(`gridcell-${customerId}-${month}`);
  if(gridCell && row) gridCell.innerHTML = gridCellContent(row);

  if(state.statementCustomerId === customerId){
    const wrap = document.getElementById('statement-body-wrap');
    if(wrap) wrap.innerHTML = renderStatementBody(c);
  }
}

async function saveGridCell(customerId, month){
  const c = state.customers.find(x=>x.id===customerId);
  const status = document.getElementById('gcm-status').value;
  const amount = status==='paid' ? (Number(document.getElementById('gcm-amount').value)||0) : 0;
  const receivedBy = status==='paid' ? (document.getElementById('gcm-receiver')?.value==='firas' ? 'firas' : 'mohammed') : undefined;
  const wasPaidLocally = state.payments[`${customerId}:${month}`]?.status==='paid';
  closeEditPaymentModal();

  const expectNew = status==='paid' && !wasPaidLocally;   // the SERVER refuses a duplicate atomically (no more check-then-write race)

  // optimistic: patch the UI instantly, no full page reload / scroll jump
  applyLocalPaymentUpdate(customerId, month, status, amount, state.user.name, receivedBy);

  const res = await api("setPaymentStatus", {customerId, month, status, amount, receivedBy, expectNew});
  if(res.alreadyPaid){
    alert(`هذا الشهر (${monthLabelOf(month)}) مسدد مسبقًا لـ ${c.name} بتاريخ ${isoToDateStr(res.date)} بواسطة ${res.recordedBy||"غير معروف"}. لم يتم تسجيل أي تعديل جديد.`);
    applyLocalPaymentUpdate(customerId, month, 'paid', res.amount, res.recordedBy, res.receivedBy, res.date);
    return;
  }
  if(res.networkError){
    queueOutbox("setPaymentStatus", {customerId, month, status, amount, receivedBy, expectNew});
    showToast("لا يوجد اتصال — سيُحفظ تلقائيًا عند عودة الإنترنت");
    return;
  }
  if(!res.ok){
    showToast("تعذر الحفظ: " + (res.error||""));
    await loadAllData();
    return;
  }

  if(status==='paid' && confirm("تم تسجيل الدفعة. هل تريد إرسال تأكيد عبر واتساب؟")){
    window.open(waLink(c.phone, buildConfirmMessage(c, monthLabelOf(month), amount)), "_blank");
  }
}

// ======================= FINANCIAL BOX (الصندوق المالي) =======================
const OPENING_CATEGORY  = "رصيد افتتاحي";
const HANDOVER_CATEGORY = "تسليم مالي من محمد (المحاسب)";
const CAT_STARLINK  = "اشتراك ستارلينك";
const CAT_TURKISH   = "اشتراك نت تركي";
const CAT_EQUIPMENT = "شراء تجهيزات للشبكة";
const CAT_WAGE      = "أجرة المحاسب";
const CAT_SISTER    = "مصاريف خاصة (الأخت) عبر محمد";
const EXPENSE_CATEGORIES = {
  out: [CAT_STARLINK, CAT_TURKISH, CAT_EQUIPMENT, CAT_WAGE, CAT_SISTER, "أخرى"],
  in:  [HANDOVER_CATEGORY, OPENING_CATEGORY, "إيراد آخر", "أخرى"],
};
const DELIVERY_METHODS = ["نقدًا","حوالة شام كاش","أخرى"];
const BOX_NAME = { mohammed:"محمد", firas:"فراس" };

function todayDateStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function localDateStr(iso){
  const d = new Date(iso);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function fmtCurrency(amount, currency){
  const n = (Number(amount)||0).toLocaleString("en-US");
  return currency==="USD" ? `${n} $` : `${n} ل.س`;
}
function catLabel(e){ return e.category==="أخرى" ? (e.categoryOther||"أخرى") : e.category; }
function partyLabel(e){ return e.recipient==="أخرى" ? (e.recipientOther||"أخرى") : e.recipient; }
function sumExp(arr, cur){ return arr.filter(e=>e.currency===cur).reduce((s,e)=>s+e.amount,0); }
function withCurrent(list, current){ return (current && !list.includes(current)) ? [current, ...list] : list; }

// which box a movement belongs to; old rows without a box count as Mohammed's
function defaultBox(type, category){
  if(type==='in') return "mohammed";
  if(category===CAT_STARLINK || category===CAT_TURKISH || category===CAT_EQUIPMENT) return "firas";
  return "mohammed";
}
function boxOf(e){ return e.box==="firas" ? "firas" : "mohammed"; }
function isHandover(e){ return e.type==='in' && e.category===HANDOVER_CATEGORY; }
function isOpening(e){ return e.type==='in' && e.category===OPENING_CATEGORY; }

// SYP value of a movement (USD uses the exchange rate typed for that day); null if a USD entry has no rate
function sypValue(e){
  if(e.currency==='USD') return e.rate>0 ? e.amount*e.rate : null;
  return e.amount;
}
// a USD payment with a rate is paid out of the Syrian-pound income (converted at that day's rate)
function effOut(e){
  if(e.currency==='USD' && e.rate>0) return {SYP:e.amount*e.rate, USD:0};
  return e.currency==='USD' ? {SYP:0, USD:e.amount} : {SYP:e.amount, USD:0};
}

// ---- subscriber payments helpers ----
function splitKey(key){ const i = key.lastIndexOf(":"); return { customerId:key.slice(0,i), month:key.slice(i+1) }; }
// revenue of a month = payments recorded FOR that month (whenever they were paid)
function revenueForMonth(month){
  let t = 0;
  Object.entries(state.payments).forEach(([k,rec])=>{
    if(rec.status==='paid' && splitKey(k).month===month) t += (rec.amount||0);
  });
  return t;
}
// what customers still owe for that month
function outstandingForMonth(month){
  let t = 0;
  enabledCustomers().forEach(c=>{
    const r = getStatementRows(c).find(x=>x.key===month);
    if(r && r.status==='unpaid') t += r.due;
  });
  return t;
}
// payments that have a real paid date (old imported ones have none, so they never enter the cash boxes)
function datedPayments(){
  const list = [];
  Object.entries(state.payments).forEach(([k,rec])=>{
    if(rec.status==='paid' && rec.date){
      const {customerId, month} = splitKey(k);
      list.push({ customerId, month, amount:rec.amount||0, date:localDateStr(rec.date), by: rec.receivedBy==='firas' ? 'firas' : 'mohammed' });
    }
  });
  return list;
}
function collectedSplit(month){
  const r = { mohammed:0, firas:0 };
  datedPayments().filter(p=>p.date.slice(0,7)===month).forEach(p=>{ r[p.by] += p.amount; });
  return r;
}

// ---- the two cash boxes (cumulative, each starts at its own opening-balance date) ----
function boxesData(){
  const all = state.expensesList;
  const pays = datedPayments();
  const res = {};
  ["mohammed","firas"].forEach(b=>{
    const openings = all.filter(e=>isOpening(e) && boxOf(e)===b);
    const cutoff = openings.length ? openings.map(e=>e.date).sort()[0] : "";
    const inRange = d => !cutoff || d >= cutoff;
    const opening = { SYP:sumExp(openings,'SYP'), USD:sumExp(openings,'USD') };
    const collections = pays.filter(p=>p.by===b && inRange(p.date)).reduce((s,p)=>s+p.amount,0);
    const otherIn = all.filter(e=>e.type==='in' && !isOpening(e) && !isHandover(e) && boxOf(e)===b && inRange(e.date));
    const inOther = { SYP:sumExp(otherIn,'SYP'), USD:sumExp(otherIn,'USD') };
    const out = { SYP:0, USD:0 };
    all.filter(e=>e.type!=='in' && boxOf(e)===b && inRange(e.date)).forEach(e=>{ const x = effOut(e); out.SYP += x.SYP; out.USD += x.USD; });
    const hand = all.filter(e=>isHandover(e) && inRange(e.date));
    const handover = { SYP:sumExp(hand,'SYP'), USD:sumExp(hand,'USD') };
    const sign = b==='mohammed' ? -1 : 1;   // a handover leaves Mohammed's box and enters Feras's
    res[b] = {
      hasOpening: openings.length>0, cutoff, opening, collections, inOther, out, handover,
      syp: opening.SYP + collections + inOther.SYP - out.SYP + sign*handover.SYP,
      usd: opening.USD + inOther.USD - out.USD + sign*handover.USD,
      hasUSD: all.some(e=>e.currency==='USD' && (isHandover(e) || boxOf(e)===b)),
    };
  });
  return res;
}

// ---- profit / what reaches the owner ----
function profitForMonth(month){
  const entries = state.expensesList.filter(e=>e.type!=='in' && (e.date||"").slice(0,7)===month);
  let missingRate = 0;
  const sumCat = pred => { let t = 0; entries.filter(pred).forEach(e=>{ const v = sypValue(e); if(v==null) missingRate++; else t += v; }); return t; };
  const starlink  = sumCat(e=>e.category===CAT_STARLINK);
  const turkish   = sumCat(e=>e.category===CAT_TURKISH);
  const wage      = sumCat(e=>e.category===CAT_WAGE);
  const other     = sumCat(e=>e.category==="أخرى");
  const equipment = sumCat(e=>e.category===CAT_EQUIPMENT);
  const revenue = revenueForMonth(month);
  const outstanding = outstandingForMonth(month);
  const costs = starlink + turkish + wage + other;
  return { revenue, outstanding, starlink, turkish, wage, other, equipment, costs,
           operating: revenue - costs, afterEquipment: revenue - costs - equipment,
           ifAllPaid: revenue + outstanding - costs, missingRate };
}
function reachedForMonth(month){
  const inMonth = e => (e.date||"").slice(0,7)===month;
  const hand = state.expensesList.filter(e=>isHandover(e) && inMonth(e));
  const sister = state.expensesList.filter(e=>e.type!=='in' && e.category===CAT_SISTER && inMonth(e));
  const direct = datedPayments().filter(p=>p.by==='firas' && p.date.slice(0,7)===month).sort((a,b)=>a.date.localeCompare(b.date));
  return {
    hand, sister, direct,
    handSYP: sumExp(hand,'SYP'), handUSD: sumExp(hand,'USD'),
    directSYP: direct.reduce((s,p)=>s+p.amount,0),
    sisterSYP: sumExp(sister,'SYP'), sisterUSD: sumExp(sister,'USD'),
  };
}

async function loadExpenses(silent){
  if(!state.expensesMonth) state.expensesMonth = currentMonthKey;
  if(!state.expensesLoaded){
    const c = loadFinCache();                      // show the last known figures immediately (also when there is no internet)
    if(c){
      state.expensesServer = c.expenses || []; state.cashCounts = c.counts || [];
      state.expensesLastOk = c.ts || 0; state.expensesLoaded = true; state.expensesStale = true;
      rebuildExpensesFromOutbox();
    }
  }
  if(!silent){ state.expensesLoading = !state.expensesLoaded; render(); }
  const r = await api("getExpenses", {});
  if(r.ok){
    state.expensesServer = r.expenses || [];
    state.expensesLoaded = true; state.expensesStale = false; state.expensesLoadError = ""; state.expensesLastOk = Date.now();
    const rc = await api("getCashCounts", {limit:30});
    if(rc.ok){ state.cashCounts = rc.counts || []; state.cashCountsError = ""; }
    else if(rc.missingSheet){ state.cashCounts = []; state.cashCountsError = rc.error || ""; }
    cacheFin();
    rebuildExpensesFromOutbox();
  } else {
    state.expensesStale = true;
    if(!state.expensesLoaded) state.expensesLoadError = r.networkError ? "لا يوجد اتصال بالإنترنت ولا توجد نسخة محفوظة من بيانات الصندوق." : (r.error || "تعذر تحميل بيانات الصندوق");
    else if(!r.networkError && !r.authError) showToast("تعذر تحميل بيانات الصندوق: " + (r.error||""));
  }
  state.expensesLoading = false; render();
}

// ======================= CASH COUNT (جرد الصندوق) =======================
function lastCountFor(box){ return (state.cashCounts||[]).find(c=>c.box===box) || null; }
function diffText(dS, dU){
  const parts = [];
  if(dS!==0) parts.push(dS<0 ? `عجز ${fmtMoney(-dS)}` : `زيادة ${fmtMoney(dS)}`);
  if(dU!==0) parts.push(dU<0 ? `عجز ${(-dU).toLocaleString("en-US")} $` : `زيادة ${dU.toLocaleString("en-US")} $`);
  return parts.join(" · ") || "مطابق ✓";
}
function countLine(box){
  const c = lastCountFor(box);
  if(!c) return `<span style="color:var(--muted)">لم يُجرَد بعد</span>`;
  const bad = c.diffSYP!==0 || c.diffUSD!==0;
  const color = !bad ? "var(--accent)" : (c.settled ? "var(--muted)" : "var(--warn)");
  return `<span style="color:${color}">آخر جرد ${c.date}: ${diffText(c.diffSYP, c.diffUSD)}${bad && c.settled ? " (سُوّي)" : ""}</span>`;
}

    <div class="section-heading"><h3>سجل جرد الصندوق</h3><span class="count-badge">${list.length} سجل</span></div>
    ${state.cashCountsError ? `<div style="background:var(--warn-dim);color:var(--warn);font-size:12.5px;padding:8px 10px;border-radius:7px">${escAttr(state.cashCountsError)}</div>` :
      list.length===0 ? `<div class="empty">لا يوجد جرد بعد. اضغط "جرد الصندوق" في بطاقة الصندوق وأدخل المبلغ الفعلي.</div>` : `
    <table style="min-width:560px"><thead><tr><th>التاريخ</th><th>الصندوق</th><th>الفعلي</th><th>المتوقع</th><th>الفرق</th><th>بواسطة</th><th></th></tr></thead>

        <td>${c.date}</td><td>${BOX_NAME[c.box]}</td>
        <td>${fmtMoney(c.countedSYP)}${c.countedUSD?`<div style="color:var(--muted);font-size:11px">${c.countedUSD.toLocaleString("en-US")} $</div>`:""}</td>
        <td>${fmtMoney(c.expectedSYP)}${c.expectedUSD?`<div style="color:var(--muted);font-size:11px">${c.expectedUSD.toLocaleString("en-US")} $</div>`:""}</td>
        <td style="color:${!bad?"var(--accent)":(c.settled?"var(--muted)":"var(--warn)")};font-weight:700">${diffText(c.diffSYP, c.diffUSD)}${c.notes?`<div style="color:var(--muted);font-size:11px;font-weight:400">${escAttr(c.notes)}</div>`:""}</td>
        <td>${escAttr(c.countedBy)}</td>
        <td class="action-cell">${c.settled ? '<span class="pill">سُوّي</span>' : (bad && isAdmin ? `<button class="btn secondary small" onclick='settleCount(${JSON.stringify(c.id)})'>تسوية الفرق</button>` : "")}</td>

function openCashCountModal(box){
  const pend = state.expensesList.filter(e=>e.pending).length + getOutbox().filter(i=>i.action==="setPaymentStatus" && isMine(i)).length;
  if(state.expensesStale || pend>0){
    alert("لا يمكن الجرد الآن: " + (pend>0 ? "توجد تغييرات بانتظار المزامنة" : "بيانات الصندوق غير محدّثة (لا يوجد اتصال)") + ".\nالجرد يقارن المبلغ الفعلي بالمتوقع، ويجب أن يكون المتوقع محدّثًا. انتظر حتى تتم المزامنة ثم أعد المحاولة.");
    return;
  }
  const d = boxesData()[box];
  const showUSD = d.hasUSD || d.usd!==0;
  const expSYP = Math.round(d.syp), expUSD = Math.round(d.usd);
  closeCashCountModal();
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "cashcount-overlay";
  overlay.innerHTML = `
    <div class="modal-box stack-form">
      <h3>جرد ${box==="firas" ? "صندوق فراس" : "صندوق محمد"}</h3>
      <div style="color:var(--muted);font-size:13px;margin-bottom:8px">المتوقع حسب الحركات: <b>${fmtMoney(expSYP)}</b>${showUSD ? ` · <b>${expUSD.toLocaleString("en-US")} $</b>` : ""}</div>
      <div class="form-row"><div><label>المبلغ الفعلي الموجود الآن (ل.س)</label><input id="cc-syp" type="number" oninput="updateCountDiff(${expSYP},${expUSD})" /></div></div>
      ${showUSD ? `<div class="form-row"><div><label>المبلغ الفعلي بالدولار ($)</label><input id="cc-usd" type="number" oninput="updateCountDiff(${expSYP},${expUSD})" /></div></div>` : ""}
      <div id="cc-diff" style="font-size:13.5px;font-weight:700;margin:6px 0 10px"></div>
      <div class="form-row"><div><label>ملاحظات (اختياري)</label><input id="cc-notes" /></div></div>
      <div class="modal-actions">
        <button class="btn" onclick='saveCashCount(${JSON.stringify(box)},${expSYP},${expUSD})'>حفظ الجرد</button>
        <button class="btn secondary" onclick="closeCashCountModal()">إلغاء</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  setTimeout(()=>{ const el = document.getElementById("cc-syp"); if(el) el.focus(); }, 60);
}
function closeCashCountModal(){
  const el = document.getElementById("cashcount-overlay");
  if(el) el.remove();
}
function updateCountDiff(expSYP, expUSD){
  const out = document.getElementById("cc-diff");
  const sEl = document.getElementById("cc-syp");
  if(!out || !sEl) return;
  if(sEl.value===""){ out.textContent = ""; return; }
  const uEl = document.getElementById("cc-usd");
  const dS = (Number(sEl.value)||0) - expSYP;
  const dU = (uEl && uEl.value!=="") ? (Number(uEl.value)||0) - expUSD : 0;
  out.style.color = (dS===0 && dU===0) ? "var(--accent)" : "var(--warn)";
  out.textContent = diffText(dS, dU);
}
async function saveCashCount(box, expSYP, expUSD){
  const sEl = document.getElementById("cc-syp");
  if(!sEl || sEl.value===""){ alert("أدخل المبلغ الفعلي بالليرة"); return; }
  const uEl = document.getElementById("cc-usd");
  const payload = {
    box, countedSYP: Number(sEl.value)||0,
    countedUSD: (uEl && uEl.value!=="") ? (Number(uEl.value)||0) : expUSD,
    expectedSYP: expSYP, expectedUSD: expUSD,
    notes: (document.getElementById("cc-notes")?.value || "").trim(),
  };
  closeCashCountModal();
  const r = await api("saveCashCount", payload);
  if(r.networkError){ alert("لا يوجد اتصال بالإنترنت — لم يُحفظ الجرد. أعد المحاولة عند عودة الاتصال."); return; }
  if(!r.ok){ alert(r.error || "تعذر حفظ الجرد"); return; }
  showToast(r.diffSYP===0 && r.diffUSD===0 ? "تم الجرد — الرصيد مطابق ✓" : "تم حفظ الجرد — يوجد فرق");
  await loadExpenses();
}
async function settleCount(id){
  if(!confirm("سيُسجَّل حركة تسوية بقيمة الفرق ليتطابق رصيد الصندوق مع الجرد الفعلي. متابعة؟")) return;
  const r = await api("settleCashCount", {id});
  if(!r.ok){ alert(r.error || "تعذرت التسوية"); return; }
  showToast("تمت التسوية ✓");
  await loadExpenses();
}

// ---- form handlers ----
// keeps the in-memory form equal to what is typed, so a refresh / sync / month change can never erase it
function syncExpenseForm(){ try{ readExpenseForm(); }catch(e){} }
function syncCustomerForm(){ try{ customerForm = readCustomerFields("cf"); }catch(e){} }
function readExpenseForm(){
  const g = id => document.getElementById(id);
  const type = g("ef-type").value;
  const category = g("ef-category").value;
  const currency = g("ef-currency").value;
  expenseForm = {
    type, category, currency,
    date: g("ef-date").value || todayDateStr(),
    categoryOther: g("ef-category-other")?.value?.trim() || "",
    box: (type==='in' && category===HANDOVER_CATEGORY) ? "firas" : (g("ef-box").value || defaultBox(type, category)),
    recipient: g("ef-recipient").value,
    recipientOther: g("ef-recipient-other")?.value?.trim() || "",
    rate: currency==='USD' ? (Number(g("ef-rate").value)||0) : 0,
    amount: Number(g("ef-amount").value) || 0,
    notes: g("ef-notes").value.trim(),
  };
}
function onExpenseTypeChange(newType){
  readExpenseForm();
  expenseForm.type = newType;
  expenseForm.category = EXPENSE_CATEGORIES[newType][0];
  expenseForm.categoryOther = "";
  expenseForm.box = defaultBox(newType, expenseForm.category);
  render();
}
function onExpenseCategoryChange(v){
  const type = document.getElementById("ef-type").value;
  const isHand = (type==='in' && v===HANDOVER_CATEGORY);
  const show = (id, on) => { const el = document.getElementById(id); if(el) el.style.display = on ? 'block':'none'; };
  show("ef-category-other-wrap", v==='أخرى');
  show("ef-box-wrap", !isHand);
  show("ef-handover-hint", isHand);
  const box = document.getElementById("ef-box"); if(box) box.value = defaultBox(type, v);
}
function onExpenseCurrencyChange(v){
  const el = document.getElementById("ef-rate-wrap"); if(el) el.style.display = v==='USD' ? 'block':'none';
  updateRateHint();
}
function updateRateHint(){
  const el = document.getElementById("ef-rate-hint"); if(!el) return;
  const cur = document.getElementById("ef-currency").value;
  const amt = Number(document.getElementById("ef-amount").value) || 0;
  const rate = Number(document.getElementById("ef-rate")?.value) || 0;
  el.textContent = (cur==='USD' && amt>0 && rate>0) ? `= ${(amt*rate).toLocaleString("en-US")} ل.س بسعر ${rate.toLocaleString("en-US")}` : "";
}
async function submitExpenseForm(){
  readExpenseForm();
  if(!expenseForm.amount || expenseForm.amount<=0){ alert("أدخل مبلغًا صحيحًا"); return; }
  if(expenseForm.type==='out' && expenseForm.currency==='USD' && !(expenseForm.rate>0)){
    alert("أدخل سعر الصرف يوم التسديد (ل.س لكل 1$) — مطلوب للمدفوعات بالدولار لحساب التكلفة بالليرة.");
    return;
  }
  const keepType = expenseForm.type;
  const form = { ...expenseForm };
  const wasEditing = editingExpenseId;
  const afterQueued = (msg)=>{
    editingExpenseId = null;
    expenseForm = blankExpenseForm(keepType);
    rebuildExpensesFromOutbox();
    render();
    showToast(msg, 4000);
  };
  if(wasEditing){
    // an entry that has not reached the server yet: just rewrite the waiting request
    const upd = updateQueuedAdd(wasEditing, form);
    if(upd==="busy"){ alert("هذه الحركة قيد الإرسال إلى الخادم الآن. انتظر بضع ثوانٍ حتى تُحفظ ثم عدّلها، فلا يضيع تعديلك."); return; }
    if(upd){ afterQueued("تم تعديل الحركة المعلّقة ✓"); return; }
    const r = await api("editExpense", {id:wasEditing, patch:form});
    if(r.networkError){ queueOutbox("editExpense", {id:wasEditing, patch:form}); afterQueued("لا يوجد اتصال — سيُحفظ التعديل تلقائيًا عند عودة الإنترنت"); return; }
    if(!r.ok && /غير موجود/.test(r.error || "")){
      // the entry was deleted, or was saved under a new number after a sync. Nothing was written.
      editingExpenseId = null;
      expenseForm = { ...form };                 // keep exactly what was typed; the button becomes «إضافة»
      await loadExpenses(true);
      alert("الحركة التي كنت تعدّلها لم تعد موجودة بهذا الرقم (حُذفت، أو حُفظت برقم جديد بعد المزامنة).\n\nلم يُحفظ شيء الآن، وحدّثتُ القائمة.\n• إن وجدتها في جدول «حركات الشهر» فعدّلها من هناك.\n• وإلا اضغط «إضافة» لحفظ ما أدخلته كحركة جديدة (ما كتبته ما زال في النموذج).");
      return;
    }
    if(!r.ok){ alert(r.error || "تعذر الحفظ"); return; }
  } else {
    // the client-made id makes a retry harmless: the server ignores a movement it already has
    const payload = { ...form, clientId:newClientId() };
    const r = await api("addExpense", payload);
    if(r.networkError){ queueOutbox("addExpense", payload); afterQueued("لا يوجد اتصال — حُفظت الحركة على الجهاز وستُرسل تلقائيًا عند عودة الإنترنت"); return; }
    if(!r.ok){ alert(r.error || "تعذر الحفظ"); return; }
  }
  editingExpenseId = null;
  expenseForm = blankExpenseForm(keepType);
  showToast("تم الحفظ ✓");
  await loadExpenses(true);
}
function startEditExpense(id){
  const e = state.expensesList.find(x=>x.id===id);
  if(!e || !canEditExpense(e)) return;
  editingExpenseId = id;
  expenseForm = { type:e.type, date:e.date, category:e.category, categoryOther:e.categoryOther||"", box:boxOf(e), recipient:e.recipient, recipientOther:e.recipientOther||"", currency:e.currency, rate:e.rate||"", amount:e.amount, notes:e.notes||"" };
  render();
  setTimeout(()=>{ updateRateHint(); const el = document.getElementById('ef-amount'); if(el) el.scrollIntoView({behavior:'smooth', block:'center'}); }, 50);
}
function cancelEditExpense(){
  editingExpenseId = null;
  expenseForm = blankExpenseForm(expenseForm.type);
  render();
}
async function deleteExpenseRow(id){
  if(!confirm("حذف هذه الحركة نهائيًا؟")) return;
  // a movement still waiting in the queue was never saved: just cancel it
  const cq = cancelQueuedAdd(id);
  if(cq==="busy"){ alert("هذه الحركة قيد الإرسال إلى الخادم الآن. انتظر بضع ثوانٍ حتى تُحفظ ثم احذفها."); return; }
  if(cq){ rebuildExpensesFromOutbox(); render(); showToast("أُلغيت الحركة المعلّقة"); return; }
  const r = await api("deleteExpense", {id});
  if(r.ok) await loadExpenses(true); else alert(r.networkError ? "الحذف يحتاج اتصالًا بالإنترنت. أعد المحاولة عند عودته." : r.error);
}

// ======================= PRICING =======================
let pricingDraft = null;
function renderPricing(){
  if(!pricingDraft) pricingDraft = {...state.pricing};
  const speeds = Object.keys(pricingDraft).map(Number).sort((a,b)=>a-b);
  return `
  <h1 class="page-title">إعدادات الأسعار</h1>
  <div class="panel">
    <h3>الباقات الحالية</h3>
    <table><thead><tr><th>السرعة</th><th>السعر الشهري</th><th></th></tr></thead>
    <tbody>${speeds.map(s=>`<tr>
      <td>${s} ميغا</td>
      <td><input type="number" value="${pricingDraft[s]}" style="width:130px" onchange="pricingDraft[${s}]=Number(this.value)||0" /> ل.س</td>
      <td><button class="btn danger small" onclick="removeTier(${s})">حذف</button></td>
    </tr>`).join("")}</tbody></table>
    <div class="form-row" style="margin-top:16px">
      <div><label>سرعة جديدة (ميغا)</label><input id="new-speed" type="number" style="width:110px" /></div>
      <div><label>السعر</label><input id="new-price" type="number" style="width:130px" /></div>
      <button class="btn secondary" onclick="addTier()">إضافة باقة</button>
    </div>
    <div style="margin-top:16px"><button class="btn" onclick="savePricingDraft()">حفظ الأسعار</button></div>
  </div>
  `;
}
function removeTier(s){ delete pricingDraft[s]; render(); }
function addTier(){
  const s = Number(document.getElementById("new-speed").value);
  const p = Number(document.getElementById("new-price").value);
  if(!s || !p) return;
  pricingDraft[s] = p; render();
}
async function savePricingDraft(){ await doSavePricing(pricingDraft); pricingDraft=null; }

// ======================= INIT =======================
(async function init(){
  let saved = null;
  try{
    saved = window.__ispSession.get();
    if(saved) state.user = JSON.parse(saved);
    if(state.user && !state.user.token){ window.__ispSession.clear(); state.user = null; }   // old session without a server token
  }catch(e){
    window.__ispSession.clear();
    state.user = null; saved = null;
  }
  if(state.user){
    try{
      const lastView = localStorage.getItem('isp_last_view');
      if(lastView) state.view = lastView;
    }catch(e){}
    await loadAllData();
    if(state.view==="activitylog"){ activityLogFetched = true; loadActivityLog(); }
    if(state.view==="users"){ usersFetched = true; loadUsers(); }
    if(state.view==="expenses"){ expensesFetched = true; loadExpenses(); }
    setTimeout(maybeShowInstallPrompt, 600);
  }
  render();
  if(window.__ispRecoveryOK) window.__ispRecoveryOK();
})();
</script>
